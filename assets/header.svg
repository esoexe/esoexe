<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">ESO EXE terminal</title>
  <desc id="d">A terminal session for ilyass, ESO EXE. Freedom isn't a feature. It's the whole point. Projects: A.S.T.R.O AI, Falcon AI Studio, the Homebrew tap and ESO Base.</desc>
  <style>
    .win { fill: #0B0B0B; stroke: #26241F; stroke-width: 2; }
    .bar { fill: #1A1917; }
    .dot { fill: #4A463F; }
    .title { font: 500 14px ui-monospace, Menlo, Consolas, monospace; fill: #A39D90; letter-spacing: 1px; }
    .txt { font: 400 19px ui-monospace, Menlo, Consolas, monospace; fill: #E8E3D6; }
    .dim { fill: #8A8478; }
    .acc { fill: #C8643A; }
    .intro { opacity: 0; animation: reveal 0.1s steps(1) forwards; }
    .i0 { animation-delay: 0.2s; }
    .i1 { animation-delay: 1.0s; }
    .i2 { animation-delay: 1.8s; }
    .i3 { animation-delay: 2.6s; }
    @keyframes reveal { to { opacity: 1; } }
    .loop { opacity: 0; animation: session 16s steps(1) infinite; }
    .s0 { animation-delay: 3.4s; }
    .s1 { animation-delay: 3.4s; }
    .s2 { animation-delay: 3.4s; }
    @keyframes session { 0% { opacity: 0; } 0.1% { opacity: 1; } 99.9% { opacity: 1; } 100% { opacity: 0; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .intro, .loop, .caret { animation: none; opacity: 1; }
    }
  </style>
  <rect class="win" x="1" y="1" width="998" height="338" rx="10"/>
  <rect class="bar" x="1" y="1" width="998" height="40" rx="10"/>
  <circle class="dot" cx="26" cy="21" r="6"/>
  <circle class="dot" cx="46" cy="21" r="6"/>
  <circle class="dot" cx="66" cy="21" r="6"/>
  <text class="title" x="500" y="26" text-anchor="middle">ilyass@eso-exe: ~</text>

  <g class="intro i0"><text class="txt" x="40" y="88">$ whoami</text></g>
  <g class="intro i1"><text class="txt" x="40" y="122">Ilyass, also known as <tspan class="acc">ESO EXE</tspan></text></g>
  <g class="intro i2"><text class="txt" x="40" y="156">$ cat mission.txt</text></g>
  <g class="intro i3"><text class="txt" x="40" y="190">Freedom isn't a feature. It's the whole point.</text></g>

  <g class="loop s0"><text class="txt" x="40" y="236">$ ls projects/</text></g>
  <g class="loop s1"><text class="txt" x="40" y="270">astro-ai  falcon-ai  homebrew-tap  eso-base</text></g>
  <g class="loop s2"><text class="txt dim" x="40" y="304">$ <tspan class="caret">_</tspan></text></g>
</svg>
