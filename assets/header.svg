<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
  <title id="t">ESO EXE terminal</title>
  <desc id="d">A terminal session: ilyass, ESO EXE. Freedom isn't a feature. It's the whole point. Watching eso-exe.pages.dev.</desc>
  <style>
    .win { fill: #161513; }
    .bar { fill: #26241F; }
    .dot { fill: #4A463F; }
    .title { font: 500 14px/1 ui-monospace, Menlo, Consolas, monospace; fill: #A39D90; letter-spacing: 1px; }
    .line { font: 400 20px/1 ui-monospace, Menlo, Consolas, monospace; opacity: 0; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes l0 { 0%,0.00% { opacity:0; transform:translateX(-6px); } 2.50%,94% { opacity:1; transform:none; } 100% { opacity:0; } } .l0 { animation: l0 14.0s linear infinite; } @keyframes l1 { 0%,6.43% { opacity:0; transform:translateX(-6px); } 8.93%,94% { opacity:1; transform:none; } 100% { opacity:0; } } .l1 { animation: l1 14.0s linear infinite; } @keyframes l2 { 0%,12.86% { opacity:0; transform:translateX(-6px); } 15.36%,94% { opacity:1; transform:none; } 100% { opacity:0; } } .l2 { animation: l2 14.0s linear infinite; } @keyframes l3 { 0%,19.29% { opacity:0; transform:translateX(-6px); } 21.79%,94% { opacity:1; transform:none; } 100% { opacity:0; } } .l3 { animation: l3 14.0s linear infinite; } @keyframes l4 { 0%,25.71% { opacity:0; transform:translateX(-6px); } 28.21%,94% { opacity:1; transform:none; } 100% { opacity:0; } } .l4 { animation: l4 14.0s linear infinite; } @keyframes l5 { 0%,32.14% { opacity:0; transform:translateX(-6px); } 34.64%,94% { opacity:1; transform:none; } 100% { opacity:0; } } .l5 { animation: l5 14.0s linear infinite; } @keyframes l6 { 0%,38.57% { opacity:0; transform:translateX(-6px); } 41.07%,94% { opacity:1; transform:none; } 100% { opacity:0; } } .l6 { animation: l6 14.0s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none !important; opacity: 1 !important; transform: none !important; }
      .caret { animation: none; }
    }
  </style>
  <rect class="win" width="1000" height="360" rx="10"/>
  <rect class="bar" width="1000" height="40" rx="10"/>
  <rect class="bar" y="30" width="1000" height="10"/>
  <circle class="dot" cx="24" cy="20" r="6"/><circle class="dot" cx="44" cy="20" r="6"/><circle class="dot" cx="64" cy="20" r="6"/>
  <text class="title" x="500" y="25" text-anchor="middle">esoexe@github: ~</text>
  <text class="line l0" x="36" y="84" fill="#B4532A">$ whoami</text>
  <text class="line l1" x="36" y="118" fill="#EDE8DC">ilyass  ·  ESO EXE  ·  independent developer</text>
  <text class="line l2" x="36" y="152" fill="#B4532A">$ cat mission.txt</text>
  <text class="line l3" x="36" y="186" fill="#EDE8DC">Freedom isn't a feature. It's the whole point.</text>
  <text class="line l4" x="36" y="220" fill="#B4532A">$ ./watch eso-exe.pages.dev --every 10m</text>
  <text class="line l5" x="36" y="254" fill="#EDE8DC">watching the website · refreshes its GitHub data every 10 minutes</text>
  <text class="line l6" x="36" y="288" fill="#B4532A">$ </text>
  <rect class="caret" x="60" y="266" width="11" height="22" fill="#EDE8DC"/>
</svg>
