<svg xmlns="http://www.w3.org/2000/svg" width="653" height="788" viewBox="0 0 653 788" role="img" aria-labelledby="t d">
  <title id="t">Ilyass, ESO EXE, as an ASCII portrait</title>
  <desc id="d">The profile photograph drawn with text characters, with a live scan line.</desc>
  <style>
    .bg { fill: #161513; }
    .head { font: 500 11px ui-monospace, Menlo, Consolas, monospace; fill: #A39D90; letter-spacing: 1.5px; }
    .r { font: 400 12px/1 ui-monospace, Menlo, Consolas, monospace; fill: #EDE8DC; animation: shimmer 5.2s ease-in-out infinite; }
    .scan { fill: #B4532A; opacity: .85; animation: sweep 5.2s linear infinite; }
    @keyframes shimmer { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: translateY(40px); } to { transform: translateY(758px); } }
    @media (prefers-reduced-motion: reduce) { .r, .scan { animation: none; } .scan { display: none; } }
  </style>
  <rect class="bg" width="653" height="788" rx="10"/>
  <text class="head" x="24" y="24">PORTRAIT / ASCII · LIVE</text>
  <rect class="scan" x="20" y="30" width="613" height="2"/>
